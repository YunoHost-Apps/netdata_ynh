#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "netdata"
name = "NetData"
description.en = "Real-time performance and health monitoring"
description.fr = "Monitoring serveur en temps reel"

version = "2.12.2~ynh1"

maintainers = ["JimboJoe"]

[upstream]
license = "GPL-3.0"
website = "http://my-netdata.io"
demo = "https://learn.netdata.cloud/docs/agent/demo-sites/"
admindoc = "https://learn.netdata.cloud/docs"
code = "https://github.com/netdata/netdata"

[antifeatures]
not-totally-free-upstream.en = "Netdata now includes a dependencie to a UI which is under a shady license that forbids reverse engineering or customisation. See: https://github.com/YunoHost/apps/pull/2519"
not-totally-free-upstream.fr = "Netdata inclut maintenant une dépendance à une interface utilisateur qui est sous une licence bizarre qui interdit la rétro-ingénierie ou la personnalisation. Voir : https://github.com/YunoHost/apps/pull/2519"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "1500M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/netdata"

    [install.init_main_permission]
    type = "group"

    [install.admin]
    type = "user"

[resources]

    [resources.sources]
    [resources.sources.main]
    url = "https://github.com/netdata/netdata/releases/download/v2.12.2/netdata-v2.12.2.tar.gz"
    sha256 = "87f2074aa99b53f2e0ad211a44e5a869a1b7175459e5edba831bb570e94c0acd"
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = "^netdata-v([0-9.]*)tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = [
        "cmake",
        "ninja-build",
        "pkg-config",
        "bison",
        "flex",
        "gcc",
        "g++",
        "git",
        "mariadb-server",
        "libelf-dev",
        "libssl-dev",
        "liblz4-dev",
        "zlib1g-dev",
        "uuid-dev",
        "libyaml-dev",
        "libjson-c-dev",
        "libuv1-dev",
        "curl",
        "gzip",
        "libatomic1",
        "libmnl-dev",
        "libsystemd-dev",
        "python3",
        "tar",
        "libcurl4-openssl-dev",
        "libpcre2-dev"
    ]

    [resources.database]
    type = "mysql"

    [resources.go]
    version = "1.27"